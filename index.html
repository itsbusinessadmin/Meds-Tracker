<!DOCTYPE html>
<html lang="en" data-theme="system">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F5F8F8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0C1213" media="(prefers-color-scheme: dark)">
<meta name="description" content="Pillbox — medication reminders and supply tracking.">
<title>Pillbox</title>
<style>
/* ============================================================================
   PILLBOX — token layer.
   Source of truth: design-system/pillbox/MASTER.md
   Do not introduce a raw hex, px size or duration below this block.
   ========================================================================== */
:root {
  color-scheme: light dark;

  /* — neutrals — */
  --bg: #F5F8F8;
  --surface: #FFFFFF;
  --surface-raised: #EDF2F2;
  --separator: #DDE4E4;
  --text: #0B1416;
  --text-secondary: #5B6C6E;

  /* — brand — */
  --primary: #0F766E;
  --primary-pressed: #0B5C55;
  --primary-text: #0F766E;
  --primary-tint: #E4F0EF;
  --primary-on-tint: #0B5C55;
  --on-primary: #FFFFFF;

  /* — semantic status — */
  --success-text: #15803D;
  --success-tint: #E6F4EA;
  --success-on-tint: #14652F;
  --danger-text: #B42318;
  --danger-tint: #FDECEA;
  --danger-on-tint: #912018;
  --warning-text: #A15C07;
  --warning-tint: #FBF1E2;
  --warning-on-tint: #8A4E05;
  --muted-text: #5B6C6E;
  --muted-tint: #EDF2F2;

  /* — materials — */
  --material: rgba(247, 250, 250, .82);
  --material-solid: rgba(247, 250, 250, .97);
  --scrim: rgba(6, 20, 19, .40);

  /* — elevation (three, deliberately) — */
  --shadow-sheet: 0 -8px 32px rgba(6, 20, 19, .16);
  --shadow-float: 0 4px 16px rgba(6, 20, 19, .10);

  /* — spacing, 4pt grid — */
  --space-1: 4px;  --space-2: 8px;  --space-3: 12px; --space-4: 16px;
  --space-5: 20px; --space-6: 24px; --space-7: 32px; --space-8: 40px;
  --space-9: 48px; --space-10: 64px;

  /* — radii — */
  --radius-xs: 8px; --radius-sm: 12px; --radius-md: 16px;
  --radius-lg: 20px; --radius-xl: 28px; --radius-full: 999px;

  /* — type ramp (rem so Dynamic Type scales everything) — */
  --type-large-title: 2.125rem; --lh-large-title: 2.5625rem;
  --type-title-1: 1.75rem;      --lh-title-1: 2.125rem;
  --type-title-2: 1.375rem;     --lh-title-2: 1.75rem;
  --type-title-3: 1.25rem;      --lh-title-3: 1.5625rem;
  --type-headline: 1.0625rem;   --lh-headline: 1.375rem;
  --type-body: 1.0625rem;       --lh-body: 1.375rem;
  --type-callout: 1rem;         --lh-callout: 1.3125rem;
  --type-subhead: .9375rem;     --lh-subhead: 1.25rem;
  --type-footnote: .8125rem;    --lh-footnote: 1.125rem;
  --type-caption: .75rem;       --lh-caption: 1rem;
  --type-tab: .6875rem;         --lh-tab: .8125rem;

  --font: -apple-system, "SF Pro Text", "SF Pro Display", system-ui, "Helvetica Neue", sans-serif;

  /* — icons — */
  --icon-sm: 18px; --icon-md: 24px; --icon-lg: 26px; --icon-xl: 32px;

  /* — motion (exit is always faster than enter) — */
  --motion-micro: 120ms;
  --motion-state: 200ms;
  --motion-enter: 280ms;
  --motion-exit: 200ms;
  --ease-enter: cubic-bezier(.2, .9, .3, 1);
  --ease-exit: cubic-bezier(.4, 0, 1, 1);

  /* — layout — */
  --gutter: var(--space-5);
  --tabbar-h: 56px;
  --text-scale: 1;
}

@media (min-width: 431px) { :root { --gutter: var(--space-6); } }

/* Dark theme. Applied when the OS asks for it and the user has not forced
   light, or when the user has explicitly chosen dark. Never an inversion —
   elevation is carried by lightness, and teal splits into fill vs text. */
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0C1213;
    --surface: #161D1E;
    --surface-raised: #1F2829;
    --separator: #2C3839;
    --text: #ECF1F1;
    --text-secondary: #A2B1B2;

    --primary-text: #3DBFB2;
    --primary-tint: #10302E;
    --primary-on-tint: #5FD3C6;

    --success-text: #6EE7A0;
    --success-tint: #16301F;
    --success-on-tint: #6EE7A0;
    --danger-text: #FFA99C;
    --danger-tint: #3A1A16;
    --danger-on-tint: #FFA99C;
    --warning-text: #EFBE7A;
    --warning-tint: #332313;
    --warning-on-tint: #EFBE7A;
    --muted-text: #A2B1B2;
    --muted-tint: #1F2829;

    --material: rgba(20, 27, 28, .82);
    --material-solid: rgba(20, 27, 28, .97);
    --scrim: rgba(0, 0, 0, .55);

    --shadow-sheet: none;
    --shadow-float: none;
  }
}

:root[data-theme="dark"] {
  --bg: #0C1213;
  --surface: #161D1E;
  --surface-raised: #1F2829;
  --separator: #2C3839;
  --text: #ECF1F1;
  --text-secondary: #A2B1B2;

  --primary-text: #3DBFB2;
  --primary-tint: #10302E;
  --primary-on-tint: #5FD3C6;

  --success-text: #6EE7A0;
  --success-tint: #16301F;
  --success-on-tint: #6EE7A0;
  --danger-text: #FFA99C;
  --danger-tint: #3A1A16;
  --danger-on-tint: #FFA99C;
  --warning-text: #EFBE7A;
  --warning-tint: #332313;
  --warning-on-tint: #EFBE7A;
  --muted-text: #A2B1B2;
  --muted-tint: #1F2829;

  --material: rgba(20, 27, 28, .82);
  --material-solid: rgba(20, 27, 28, .97);
  --scrim: rgba(0, 0, 0, .55);

  --shadow-sheet: none;
  --shadow-float: none;
}

/* Increase Contrast. Secondary text and separators strengthen; status tints
   gain a matching border so they survive without their fill. */
@media (prefers-contrast: more) {
  :root { --text-secondary: #41504F; --separator: #B9C4C4; }
  :root[data-theme="dark"], :root:not([data-theme="light"]) {
    --text-secondary: #C4D0D1; --separator: #41504F;
  }
  .badge, .tintcard { border: 1px solid currentColor; }
}

/* ============================================================================
   Base
   ========================================================================== */
* { margin: 0; padding: 0; box-sizing: border-box; }

html {
  font-size: calc(100% * var(--text-scale));
  -webkit-text-size-adjust: 100%;
}

body {
  font-family: var(--font);
  background: var(--bg);
  color: var(--text);
  font-size: var(--type-body);
  line-height: var(--lh-body);
  -webkit-font-smoothing: antialiased;
  overscroll-behavior-y: none;
}

button, input, select { font: inherit; color: inherit; }
button { background: none; border: none; cursor: pointer; text-align: left; }
ol, ul { list-style: none; }

:focus-visible {
  outline: 2px solid var(--primary-text);
  outline-offset: 2px;
  border-radius: var(--radius-xs);
}

.sr-only {
  position: absolute; width: 1px; height: 1px; padding: 0;
  margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
}

.tnum { font-variant-numeric: tabular-nums; }

/* ============================================================================
   App shell — real safe areas, no device frame
   ========================================================================== */
.app {
  display: flex;
  flex-direction: column;
  height: 100dvh;
  max-width: 480px;
  margin-inline: auto;
  position: relative;
  background: var(--bg);
}
@media (min-width: 481px) {
  body { background: var(--surface-raised); }
  .app { box-shadow: 0 0 0 1px var(--separator); }
}

/* — nav bar — */
.nav {
  flex-shrink: 0;
  z-index: 40;
  padding-top: env(safe-area-inset-top);
  background: transparent;
  transition: background var(--motion-state) linear;
}
.nav.is-scrolled {
  background: var(--material);
  -webkit-backdrop-filter: blur(20px) saturate(180%);
  backdrop-filter: blur(20px) saturate(180%);
  box-shadow: inset 0 -1px 0 var(--separator);
}
@supports not (backdrop-filter: blur(1px)) {
  .nav.is-scrolled { background: var(--material-solid); }
}
.nav-bar {
  display: flex;
  align-items: center;
  gap: var(--space-2);
  min-height: 44px;
  padding-inline: var(--gutter);
}
.nav-compact-title {
  flex: 1;
  font-size: var(--type-headline);
  line-height: var(--lh-headline);
  font-weight: 600;
  text-align: center;
  opacity: 0;
  transition: opacity var(--motion-state) linear;
}
.nav.is-scrolled .nav-compact-title { opacity: 1; }
.nav-actions { display: flex; gap: var(--space-1); margin-left: auto; }

.large-title {
  font-size: var(--type-large-title);
  line-height: var(--lh-large-title);
  font-weight: 700;
  letter-spacing: -.4px;
  padding: 0 var(--gutter) var(--space-1);
}

/* — scrolling body — */
.screen {
  flex: 1;
  min-height: 0;
  overflow-y: auto;
  overflow-x: hidden;
  -webkit-overflow-scrolling: touch;
  scrollbar-width: none;
  padding-bottom: calc(var(--tabbar-h) + env(safe-area-inset-bottom) + var(--space-8));
}
.screen::-webkit-scrollbar { display: none; }

.section { padding: var(--space-6) var(--gutter) 0; }
.section-header {
  display: flex;
  align-items: baseline;
  gap: var(--space-2);
  font-size: var(--type-caption);
  line-height: var(--lh-caption);
  font-weight: 600;
  letter-spacing: .5px;
  text-transform: uppercase;
  color: var(--text-secondary);
  padding: 0 var(--space-1) var(--space-2);
}
.section-header .trailing { margin-left: auto; text-transform: none; letter-spacing: 0; }

/* — tab bar — */
.tabbar {
  position: fixed;
  bottom: 0;
  left: 50%;
  transform: translateX(-50%);
  width: 100%;
  max-width: 480px;
  z-index: 50;
  display: flex;
  background: var(--material);
  -webkit-backdrop-filter: blur(20px) saturate(180%);
  backdrop-filter: blur(20px) saturate(180%);
  box-shadow: inset 0 1px 0 var(--separator);
  padding-bottom: env(safe-area-inset-bottom);
}
@supports not (backdrop-filter: blur(1px)) {
  .tabbar { background: var(--material-solid); }
}
.tab {
  flex: 1;
  min-height: var(--tabbar-h);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 2px;
  padding: var(--space-2) var(--space-1);
  color: var(--text-secondary);
  transition: color var(--motion-micro) linear;
}
.tab[aria-selected="true"] { color: var(--primary-text); }
.ic-ko { stroke: var(--material-solid); stroke-width: 2; fill: none; }

.tab-label {
  font-size: var(--type-tab);
  line-height: var(--lh-tab);
  font-weight: 500;
  letter-spacing: .1px;
}

/* ============================================================================
   Components
   ========================================================================== */

/* — buttons — */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: var(--space-2);
  min-height: 44px;
  padding: var(--space-3) var(--space-5);
  border-radius: var(--radius-md);
  font-size: var(--type-headline);
  line-height: var(--lh-headline);
  font-weight: 600;
  transition: background var(--motion-micro) linear, transform var(--motion-micro) var(--ease-enter), opacity var(--motion-micro) linear;
}
.btn:active:not(:disabled) { transform: scale(.98); }
.btn:disabled { opacity: .38; cursor: default; }
.btn-primary { background: var(--primary); color: var(--on-primary); }
.btn-primary:active:not(:disabled) { background: var(--primary-pressed); }
.btn-secondary { background: var(--surface-raised); color: var(--text); }
.btn-ghost { color: var(--primary-text); }
.btn-destructive { color: var(--danger-text); }
.btn-destructive-filled { background: var(--danger-text); color: #FFFFFF; }
.btn-block { display: flex; width: 100%; min-height: 50px; }

/* 44pt target around a smaller visual — expand the hit area, not the paint */
.icon-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-width: 44px;
  min-height: 44px;
  border-radius: var(--radius-full);
  color: var(--primary-text);
  transition: background var(--motion-micro) linear, transform var(--motion-micro) var(--ease-enter);
}
.icon-btn:active { transform: scale(.94); background: var(--surface-raised); }
.icon-btn.plain { color: var(--text); }

/* — cards — */
.card {
  background: var(--surface);
  border-radius: var(--radius-md);
  padding: var(--space-4);
}
.tintcard { border-radius: var(--radius-md); padding: var(--space-4); }
.tint-danger  { background: var(--danger-tint);  color: var(--danger-on-tint); }
.tint-warning { background: var(--warning-tint); color: var(--warning-on-tint); }
.tint-success { background: var(--success-tint); color: var(--success-on-tint); }

/* — inset-grouped list — */
.group {
  background: var(--surface);
  border-radius: var(--radius-md);
  overflow: hidden;
}
.row {
  display: flex;
  align-items: center;
  gap: var(--space-3);
  width: 100%;
  min-height: 50px;
  padding: var(--space-3) var(--space-4);
  position: relative;
  transition: background var(--motion-micro) linear;
}
.row + .row::before {
  content: "";
  position: absolute;
  top: 0;
  left: var(--space-4);
  right: 0;
  height: 1px;
  background: var(--separator);
}
.row.inset-sep + .row::before { left: calc(var(--space-4) + 66px); }
button.row:active { background: var(--surface-raised); }
.row-title { display: block; font-size: var(--type-body); line-height: var(--lh-body); }
.row-value { margin-left: auto; color: var(--text-secondary); font-size: var(--type-body); }
.row-sub {
  display: block;
  font-size: var(--type-footnote);
  line-height: var(--lh-footnote);
  color: var(--text-secondary);
  margin-top: 2px;
}
.group-footer {
  font-size: var(--type-footnote);
  line-height: var(--lh-footnote);
  color: var(--text-secondary);
  padding: var(--space-2) var(--space-4) 0;
}

/* — status badge: colour + icon + word, always all three — */
.badge svg, .row-title svg, .legend-item svg { width: 1em; height: 1em; }

.badge {
  display: inline-flex;
  align-items: center;
  gap: var(--space-1);
  padding: 2px var(--space-2);
  border-radius: var(--radius-xs);
  font-size: var(--type-caption);
  line-height: var(--lh-caption);
  font-weight: 600;
  white-space: nowrap;
  flex-shrink: 0;
}
.badge-taken    { background: var(--success-tint); color: var(--success-on-tint); }
.badge-missed   { background: var(--danger-tint);  color: var(--danger-on-tint); }
.badge-low      { background: var(--warning-tint); color: var(--warning-on-tint); }
.badge-critical { background: var(--danger-tint);  color: var(--danger-on-tint); }
.badge-skipped  { background: var(--muted-tint);   color: var(--muted-text); }
.badge-due      { background: var(--primary-tint); color: var(--primary-on-tint); }
.badge-upcoming { background: var(--muted-tint);   color: var(--muted-text); }

/* — dose row — */
.dose {
  display: flex;
  align-items: flex-start;
  gap: var(--space-3);
  width: 100%;
  padding: var(--space-3) var(--space-4);
  position: relative;
}
.dose + .dose::before {
  content: "";
  position: absolute;
  top: 0;
  left: calc(var(--space-4) + 66px);
  right: 0;
  height: 1px;
  background: var(--separator);
}
.dose-time {
  width: 66px;
  flex-shrink: 0;
  font-size: var(--type-subhead);
  line-height: var(--lh-headline);
  font-weight: 500;
  color: var(--text-secondary);
}
.dose-main { display: block; flex: 1; min-width: 0; }
.dose-name {
  display: block;
  font-size: var(--type-headline);
  line-height: var(--lh-headline);
  font-weight: 600;
  overflow-wrap: break-word;
}
.dose-sub {
  display: block;
  font-size: var(--type-subhead);
  line-height: var(--lh-subhead);
  color: var(--text-secondary);
  margin-top: 2px;
  overflow-wrap: break-word;
}
.dose-meta { display: flex; flex-wrap: wrap; gap: var(--space-2); margin-top: var(--space-2); }

/* status control: 44pt target, 28px visual */
.status-btn {
  display: flex;
  align-items: center;
  justify-content: center;
  min-width: 44px;
  min-height: 44px;
  flex-shrink: 0;
  margin-block: calc(-1 * var(--space-1));
  border-radius: var(--radius-full);
}
.status-dot {
  width: 28px;
  height: 28px;
  border-radius: var(--radius-full);
  display: flex;
  align-items: center;
  justify-content: center;
  transition: background var(--motion-state) var(--ease-enter), border-color var(--motion-state) linear;
}
.status-dot.is-taken   { background: var(--success-tint); color: var(--success-on-tint); }
.status-dot.is-due     { border: 2px solid var(--primary-text); color: var(--primary-text); }
.status-dot.is-upcoming{ border: 2px solid var(--separator); color: transparent; }
.status-dot.is-missed  { background: var(--danger-tint); color: var(--danger-on-tint); }
.status-dot.is-skipped { background: var(--muted-tint); color: var(--muted-text); }
.status-btn:active .status-dot { transform: scale(.9); }
.pop { animation: pop var(--motion-state) var(--ease-enter); }
@keyframes pop { from { transform: scale(.7); opacity: .4; } to { transform: scale(1); opacity: 1; } }

/* — next-dose emphasis card — */
.next {
  margin: var(--space-4) var(--gutter) 0;
  background: var(--primary-tint);
  border-radius: var(--radius-lg);
  padding: var(--space-5);
}
.next-label {
  font-size: var(--type-caption);
  line-height: var(--lh-caption);
  font-weight: 700;
  letter-spacing: .6px;
  text-transform: uppercase;
  color: var(--primary-on-tint);
}
.next-name {
  font-size: var(--type-title-2);
  line-height: var(--lh-title-2);
  font-weight: 600;
  letter-spacing: -.2px;
  margin-top: var(--space-2);
  overflow-wrap: break-word;
}
.next-dose-line {
  font-size: var(--type-subhead);
  line-height: var(--lh-subhead);
  color: var(--text-secondary);
  margin-top: var(--space-1);
}
.next-time {
  display: flex;
  align-items: center;
  gap: var(--space-2);
  flex-wrap: wrap;
  font-size: var(--type-title-3);
  line-height: var(--lh-title-3);
  font-weight: 600;
  margin-top: var(--space-3);
}
.next-rel { font-size: var(--type-subhead); font-weight: 400; color: var(--text-secondary); }
.next-actions { display: flex; gap: var(--space-2); margin-top: var(--space-4); }
.next-actions .btn-primary { flex: 1; }

/* — adherence ring — */
.ring-wrap { display: flex; align-items: center; gap: var(--space-4); padding: var(--space-3) var(--gutter) 0; }
.ring { flex-shrink: 0; }
.ring-track { stroke: var(--surface-raised); }
.ring-fill { stroke: var(--primary-text); transition: stroke-dashoffset var(--motion-enter) var(--ease-enter); }
.ring-label { font-size: var(--type-footnote); line-height: var(--lh-footnote); color: var(--text-secondary); }
.ring-count { font-size: var(--type-title-3); line-height: var(--lh-title-3); font-weight: 600; }

/* — supply — */
.supply-figures {
  display: flex;
  align-items: baseline;
  gap: var(--space-2);
  flex-wrap: wrap;
  margin-top: var(--space-3);
}
.supply-count { font-size: var(--type-title-2); line-height: var(--lh-title-2); font-weight: 700; letter-spacing: -.3px; }
.supply-days { font-size: var(--type-subhead); line-height: var(--lh-subhead); color: var(--text-secondary); }
.bar {
  height: 8px;
  border-radius: var(--radius-full);
  background: var(--surface-raised);
  overflow: hidden;
  margin-top: var(--space-3);
}
.bar-fill { height: 100%; border-radius: var(--radius-full); transition: width var(--motion-enter) var(--ease-enter); }
.bar-healthy  { background: var(--primary); }
.bar-low      { background: var(--warning-text); }
.bar-critical { background: var(--danger-text); }
.card-critical { box-shadow: inset 3px 0 0 var(--danger-text); }

/* — calendar — */
.cal { display: grid; grid-template-columns: repeat(7, 1fr); gap: var(--space-1); }
.cal-head {
  text-align: center;
  font-size: var(--type-caption);
  line-height: var(--lh-caption);
  font-weight: 600;
  color: var(--text-secondary);
  padding-bottom: var(--space-2);
}
.cal-cell {
  aspect-ratio: 1;
  min-height: 44px;
  border-radius: var(--radius-sm);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 3px;
  font-size: var(--type-subhead);
  font-weight: 600;
  position: relative;
}
.cal-cell.st-taken   { background: var(--success-tint); color: var(--success-on-tint); }
.cal-cell.st-partial { background: var(--warning-tint); color: var(--warning-on-tint); }
.cal-cell.st-missed  { background: var(--danger-tint);  color: var(--danger-on-tint); }
.cal-cell.st-skipped { background: var(--muted-tint);   color: var(--muted-text); }
.cal-cell.st-future  { color: var(--text-secondary); font-weight: 400; }
.cal-cell.is-today { box-shadow: inset 0 0 0 2px var(--primary-text); }
.cal-cell[aria-pressed="true"] { outline: 2px solid var(--primary-text); outline-offset: 1px; }
.cal-cell.is-today[aria-pressed="true"] { box-shadow: none; }
/* the shape that makes the grid readable without colour */
.shape { width: 6px; height: 6px; flex-shrink: 0; }
.shape-full { border-radius: 50%; background: currentColor; }
.shape-half { border-radius: 50%; background: linear-gradient(90deg, currentColor 50%, transparent 50%); box-shadow: inset 0 0 0 1px currentColor; }
.shape-ring { border-radius: 50%; box-shadow: inset 0 0 0 1.5px currentColor; }
.shape-slash { background: linear-gradient(45deg, transparent 40%, currentColor 40%, currentColor 60%, transparent 60%); }
.legend { display: flex; flex-wrap: wrap; gap: var(--space-3); margin-top: var(--space-4); padding-top: var(--space-3); border-top: 1px solid var(--separator); }
.legend-item { display: flex; align-items: center; gap: var(--space-1); font-size: var(--type-footnote); color: var(--text-secondary); }

/* — segmented control — */
.segmented {
  display: flex;
  background: var(--surface-raised);
  border-radius: var(--radius-sm);
  padding: 2px;
  gap: 2px;
}
.segment {
  flex: 1;
  min-height: 44px;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: calc(var(--radius-sm) - 2px);
  font-size: var(--type-subhead);
  font-weight: 500;
  color: var(--text-secondary);
  text-align: center;
  transition: background var(--motion-micro) linear, color var(--motion-micro) linear;
}
.segment[aria-selected="true"] {
  background: var(--surface);
  color: var(--text);
  font-weight: 600;
  box-shadow: var(--shadow-float);
}

/* — form controls — */
.field { margin-bottom: var(--space-5); }
.label {
  display: block;
  font-size: var(--type-subhead);
  line-height: var(--lh-subhead);
  font-weight: 600;
  margin-bottom: var(--space-2);
}
.input {
  width: 100%;
  min-height: 50px;
  background: var(--surface-raised);
  border: 1px solid transparent;
  border-radius: var(--radius-sm);
  padding: var(--space-3) var(--space-4);
  font-size: var(--type-body);
  outline: none;
}
.input::placeholder { color: var(--text-secondary); }
.input:focus-visible { outline: 2px solid var(--primary-text); outline-offset: 1px; }
.input.has-error { border-color: var(--danger-text); }
.hint { font-size: var(--type-footnote); line-height: var(--lh-footnote); color: var(--text-secondary); margin-top: var(--space-2); }
.error {
  display: flex;
  align-items: flex-start;
  gap: var(--space-1);
  font-size: var(--type-footnote);
  line-height: var(--lh-footnote);
  color: var(--danger-text);
  margin-top: var(--space-2);
}
.chips { display: flex; flex-wrap: wrap; gap: var(--space-2); }
.chip {
  display: inline-flex;
  align-items: center;
  gap: var(--space-1);
  min-height: 44px;
  padding: var(--space-2) var(--space-4);
  border-radius: var(--radius-sm);
  background: var(--surface-raised);
  font-size: var(--type-subhead);
  font-weight: 500;
}
.chip[aria-pressed="true"] { background: var(--primary-tint); color: var(--primary-on-tint); font-weight: 600; }
.chip.time-chip { font-variant-numeric: tabular-nums; }

/* switch */
.switch {
  width: 51px; height: 31px;
  flex-shrink: 0;
  margin-left: auto;
  border-radius: var(--radius-full);
  background: var(--surface-raised);
  box-shadow: inset 0 0 0 1px var(--separator);
  position: relative;
  transition: background var(--motion-state) linear;
}
.switch[aria-checked="true"] { background: var(--primary); box-shadow: none; }
.switch::after {
  content: "";
  position: absolute;
  top: 2px; left: 2px;
  width: 27px; height: 27px;
  border-radius: var(--radius-full);
  background: #FFFFFF;
  box-shadow: 0 1px 3px rgba(6, 20, 19, .25);
  transition: transform var(--motion-state) var(--ease-enter);
}
.switch[aria-checked="true"]::after { transform: translateX(20px); }

/* stepper */
.stepper { display: flex; align-items: center; gap: var(--space-2); margin-left: auto; }
.stepper-btn {
  width: 44px; height: 44px;
  display: flex; align-items: center; justify-content: center;
  border-radius: var(--radius-sm);
  background: var(--surface-raised);
  color: var(--text);
}
.stepper-btn:active { background: var(--separator); }
.stepper-btn:disabled { opacity: .38; }
.stepper-val { min-width: 44px; text-align: center; font-weight: 600; }

/* ============================================================================
   Overlays
   ========================================================================== */
.scrim {
  position: fixed;
  inset: 0;
  z-index: 90;
  background: var(--scrim);
  animation: fade var(--motion-enter) linear;
}
@keyframes fade { from { opacity: 0; } to { opacity: 1; } }

.sheet {
  position: fixed;
  left: 50%;
  transform: translateX(-50%);
  bottom: 0;
  width: 100%;
  max-width: 480px;
  z-index: 91;
  background: var(--bg);
  border-radius: var(--radius-xl) var(--radius-xl) 0 0;
  box-shadow: var(--shadow-sheet);
  border-top: 1px solid var(--separator);
  max-height: 92dvh;
  display: flex;
  flex-direction: column;
  animation: sheet-in var(--motion-enter) var(--ease-enter);
}
@keyframes sheet-in { from { transform: translate(-50%, 100%); } to { transform: translate(-50%, 0); } }
.grabber {
  width: 36px; height: 5px;
  border-radius: var(--radius-full);
  background: var(--separator);
  margin: var(--space-2) auto var(--space-1);
  flex-shrink: 0;
}
.sheet-head {
  display: flex;
  align-items: center;
  gap: var(--space-2);
  padding: var(--space-2) var(--space-4);
  min-height: 44px;
  flex-shrink: 0;
}
.sheet-title {
  flex: 1;
  text-align: center;
  font-size: var(--type-headline);
  line-height: var(--lh-headline);
  font-weight: 600;
}
.sheet-body {
  overflow-y: auto;
  padding: var(--space-4) var(--space-5) 0;
  scrollbar-width: none;
}
.sheet-body::-webkit-scrollbar { display: none; }
.sheet-foot {
  flex-shrink: 0;
  padding: var(--space-4) var(--space-5);
  padding-bottom: calc(var(--space-4) + env(safe-area-inset-bottom));
  display: flex;
  flex-direction: column;
  gap: var(--space-2);
}
.sheet-head-btn {
  font-size: var(--type-body);
  color: var(--primary-text);
  min-height: 44px;
  min-width: 44px;
  display: flex;
  align-items: center;
}
.sheet-head-btn:disabled { opacity: .38; }

/* step indicator */
.steps { display: flex; gap: var(--space-1); padding: 0 var(--space-5) var(--space-2); }
.step-pip { flex: 1; height: 4px; border-radius: var(--radius-full); background: var(--separator); }
.step-pip.done { background: var(--primary-text); }
.step-pip.err { background: var(--danger-text); }
.step-caption {
  text-align: center;
  font-size: var(--type-footnote);
  color: var(--text-secondary);
  padding-bottom: var(--space-3);
}

/* toast */
.toast {
  position: fixed;
  left: 50%;
  transform: translateX(-50%);
  bottom: calc(var(--tabbar-h) + env(safe-area-inset-bottom) + var(--space-3));
  z-index: 80;
  width: calc(100% - var(--gutter) * 2);
  max-width: 440px;
  display: flex;
  align-items: center;
  gap: var(--space-3);
  background: var(--text);
  color: var(--bg);
  border-radius: var(--radius-sm);
  padding: var(--space-3) var(--space-4);
  box-shadow: var(--shadow-float);
  animation: toast-in var(--motion-enter) var(--ease-enter);
}
@keyframes toast-in { from { transform: translate(-50%, 120%); opacity: 0; } to { transform: translate(-50%, 0); opacity: 1; } }
.toast-msg { flex: 1; font-size: var(--type-subhead); line-height: var(--lh-subhead); }
.toast-action { font-size: var(--type-subhead); font-weight: 700; color: var(--bg); text-decoration: underline; min-height: 44px; display: flex; align-items: center; padding-inline: var(--space-2); }

/* notification banner */
.banner {
  position: fixed;
  top: calc(env(safe-area-inset-top) + var(--space-2));
  left: 50%;
  transform: translateX(-50%);
  z-index: 95;
  width: calc(100% - var(--space-3) * 2);
  max-width: 456px;
  display: flex;
  align-items: flex-start;
  gap: var(--space-3);
  background: var(--material-solid);
  -webkit-backdrop-filter: blur(20px) saturate(180%);
  backdrop-filter: blur(20px) saturate(180%);
  border: 1px solid var(--separator);
  border-radius: var(--radius-md);
  padding: var(--space-3) var(--space-4);
  box-shadow: var(--shadow-float);
  text-align: left;
  animation: banner-in var(--motion-enter) var(--ease-enter);
}
@keyframes banner-in { from { transform: translate(-50%, -130%); opacity: 0; } to { transform: translate(-50%, 0); opacity: 1; } }
.banner-app { font-size: var(--type-caption); font-weight: 600; color: var(--text-secondary); text-transform: uppercase; letter-spacing: .5px; }
.banner-title { font-size: var(--type-subhead); line-height: var(--lh-subhead); font-weight: 600; margin-top: 2px; }
.banner-body { font-size: var(--type-subhead); line-height: var(--lh-subhead); color: var(--text-secondary); margin-top: 2px; }

/* empty state */
.empty {
  display: flex;
  flex-direction: column;
  align-items: center;
  text-align: center;
  padding: var(--space-10) var(--space-6);
  gap: var(--space-3);
}
.empty-icon { color: var(--text-secondary); opacity: .6; }
.empty-title { font-size: var(--type-title-3); line-height: var(--lh-title-3); font-weight: 600; }
.empty-body { font-size: var(--type-subhead); line-height: var(--lh-subhead); color: var(--text-secondary); max-width: 30ch; }

/* utilities — the only place layout one-offs are allowed to live */
.u-block { width: 100%; }
.u-flat { padding: 0; min-height: 0; }
.u-fill { flex: 1; min-width: 0; }
.u-stack { flex-direction: column; align-items: stretch; gap: var(--space-3); }
.u-mt-3 { margin-top: var(--space-3); }
.u-mb-3 { margin-bottom: var(--space-3); }
.u-mb-5 { margin-bottom: var(--space-5); }
.u-gap-2 { gap: var(--space-2); }
.u-center { text-align: center; }
.u-end { justify-content: flex-end; }
.u-optional { font-weight: 400; color: var(--text-secondary); }
.u-measure-none { max-width: none; }
.u-headline { font-size: var(--type-title-1); line-height: var(--lh-title-1); padding-top: 0; }
.u-timeinput { background: none; border: none; font: inherit; color: inherit; padding: 0; }
.u-section-tight { padding-top: var(--space-3); }
.u-section-mid { padding-top: var(--space-4); }
.u-section-loose { padding-top: var(--space-5); }
.u-section-actions { padding: var(--space-4) 0 0; }
.u-cal-head { padding: 0 0 var(--space-3); }
.u-mt-5 { margin-top: var(--space-5); }
.u-pb-5 { padding-bottom: var(--space-5); }
.u-semibold { font-weight: 600; }
.u-top { align-items: flex-start; flex-wrap: wrap; }
.u-bell { flex-shrink: 0; color: var(--primary-text); }
.u-confirm-body { margin: var(--space-2) auto 0; }
.u-success { color: var(--success-text); }
.u-warning { color: var(--warning-text); }
.u-danger  { color: var(--danger-text); }
.u-muted   { color: var(--muted-text); }

/* skeleton */
.skel { background: var(--surface-raised); border-radius: var(--radius-xs); animation: pulse 1.4s ease-in-out infinite; }
@keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .5; } }

/* ============================================================================
   Reduce Motion — transforms become opacity, nothing is silent
   ========================================================================== */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: .01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: .01ms !important;
    scroll-behavior: auto !important;
  }
}
:root[data-motion="reduced"] *,
:root[data-motion="reduced"] *::before,
:root[data-motion="reduced"] *::after {
  animation-duration: .01ms !important;
  animation-iteration-count: 1 !important;
  transition-duration: .01ms !important;
}
:root[data-motion="reduced"] .sheet,
:root[data-motion="reduced"] .toast,
:root[data-motion="reduced"] .banner { animation-name: fade; animation-duration: 100ms !important; }
</style>
</head>
<body>
<div id="root" class="app"></div>
<div id="overlays"></div>
<div id="live" class="sr-only" role="status" aria-live="polite"></div>
<script src="app.js"></script>
</body>
</html>
